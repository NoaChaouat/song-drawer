<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>מגירת שירים</title>
    <meta name="theme-color" content="#141210">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="שירים">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon.svg">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=6">
</head>
<body>
    {% block nav %}
    <nav>
        <a href="/" class="nav-logo">🎵 Song Drawer</a>
        <div style="display:flex;align-items:center;gap:10px">
            {% if session.get('admin') %}
            <a href="/songs/new" class="btn btn-primary">+ New Song</a>
            <a href="/logout" class="nav-lock" title="Logout">🔓</a>
            {% else %}
            <a href="/login" class="nav-lock" title="Login">🔒</a>
            {% endif %}
        </div>
    </nav>
    {% endblock %}
    {% block full_page %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% endblock %}
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
