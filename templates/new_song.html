{% extends 'base.html' %}
{% block content %}
<div class="form-page">
    <h1>שיר חדש</h1>
    <form method="POST" action="/songs">
        <div class="form-group">
            <label for="title">שם השיר</label>
            <input type="text" id="title" name="title" required placeholder="שם השיר...">
        </div>
        <div class="form-group">
            <label for="lyrics">מילים</label>
            <textarea id="lyrics" name="lyrics" rows="12" placeholder="כתבי את המילים כאן..."></textarea>
        </div>
        <div class="form-group">
            <label for="chords">אקורדים</label>
            <textarea id="chords" name="chords" rows="3" placeholder="לדוגמה: Am G F E"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">שמירה</button>
            <a href="/" class="btn btn-secondary">ביטול</a>
        </div>
    </form>
</div>
{% endblock %}
