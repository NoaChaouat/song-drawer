{% extends 'base.html' %}
{% block content %}
<div class="form-page">
    <h1>New Song</h1>
    <form method="POST" action="/songs">
        <div class="form-group">
            <label for="title">Song Title</label>
            <input type="text" id="title" name="title" required placeholder="Song title...">
        </div>
        <div class="form-group">
            <label for="lyrics">Lyrics</label>
            <textarea id="lyrics" name="lyrics" rows="12" placeholder="Write your lyrics here..."></textarea>
        </div>
        <div class="form-group">
            <label for="chords">Chords</label>
            <textarea id="chords" name="chords" rows="3" placeholder="e.g. Am G F E"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
